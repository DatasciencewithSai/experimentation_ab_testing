[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abtest"
version = "0.1.0"
description = "Tools for designing and analyzing A/B tests: sample size, frequentist, Bayesian and sequential methods."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/abtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# apps/ were copied as-is from the old repos; lint them once they are rewired to the library.
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
